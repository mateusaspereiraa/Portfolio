<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mateus Pereira | Portfólio T.I.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#12201a;--mute:#52635a;--line:#d3dcd6;--acc:#0a6b4f;--acc2:#e8f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#16221c;--ink:#e8f1ec;--mute:#9bb0a4;--line:#27382f;--acc:#4fd1a1;--acc2:#1b2d25}}
:root[data-theme="dark"]{--bg:#0e1612;--card:#16221c;--ink:#e8f1ec;--mute:#9bb0a4;--line:#27382f;--acc:#4fd1a1;--acc2:#1b2d25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;line-height:1.05}
.sub{color:var(--mute);max-width:60ch;margin:14px 0 0;font-size:1.05rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 22px}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.hl{border-color:var(--acc);border-width:2px}
.cover{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:var(--acc2);border-bottom:1px solid var(--line)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cat{font-size:.8rem;color:var(--mute)}
h3{font-size:1.15rem;font-weight:700}
.cap{font-size:.88rem;color:var(--mute);white-space:pre-line;margin:0;max-height:7.5em;overflow:auto;padding:8px 10px;background:var(--bg);border-radius:6px}
.row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:6px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--acc);color:var(--bg)}
.btn.v{width:100%;text-align:center}
dialog{width:min(640px,94vw);max-height:88vh;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dh h2{font-size:1.15rem}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.vi h4{margin:0 0 8px;font-size:1rem}
.vi iframe,.vi video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
.log{background:#0b120e;color:#b8f5d6;padding:12px;border-radius:8px;font:13px/1.5 ui-monospace,Menlo,monospace;min-height:120px;max-height:220px;overflow:auto;margin:0;white-space:pre-wrap}
#rs{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:.8rem}.tb th,.tb td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.br{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;align-items:center;gap:8px;font-size:.88rem;margin:5px 0}
.br i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.empty{color:var(--mute);font-size:.95rem;margin:0}
</style>
</head>
<body>
<div class="wrap">
<h1>Mateus Pereira<br>Portfólio de T.I.</h1>
<p class="sub">Desenvolvimento web, e-commerce, sistemas, dados com Python, manutenção de computadores e redes.</p>
<div class="tabs" id="tabs" role="group" aria-label="Filtrar por área"></div>
<div class="grid" id="grid"></div>
</div>

<dialog id="dlg" aria-labelledby="dt">
<div class="dh"><h2 id="dt"></h2><button class="btn" id="close">Fechar</button></div>
<div class="db" id="dbody"></div>
</dialog>

<script>
/* ============================================================
   ADICIONAR VÍDEOS (é só editar aqui)
   ------------------------------------------------------------
   Cada projeto tem uma "chave" (nome do repositório). Para
   adicionar um vídeo, coloque uma linha dentro dos colchetes:
       {t:"Título do vídeo", u:"https://link-do-video"}
   Separe os vídeos com vírgula. Aceita:
   - Link do YouTube (youtube.com/watch?v=... ou youtu.be/...): aparece incorporado
   - Arquivo direto .mp4 / .webm: aparece com player
   - Qualquer outro link (LinkedIn, Drive, Instagram): aparece como botão "Assistir"
   Chaves de manutenção e redes: "manutencao" e "redes".
   Exemplo:
     "manutencao":[ {t:"Troca de SSD e formatação", u:"https://youtu.be/XXXXXXXXXXX"},
                    {t:"Limpeza preventiva", u:"https://www.linkedin.com/posts/..."} ],
   ============================================================ */
var VIDEOS={
 "manutencao":[],
 "redes":[],
 "Site-Wpohstore":[],
 "Toplim-Catalogo-Virtual--Projeto-Final-":[],
 "financeiro":[],
 "LandingPageFocoinTech":[],
 "P-gina-de-Checkout":[],
 "Sistema-deposito-de-Bebidas-":[],
 "dyeshop":[],
 "Loja-Yshop-Online-Store":[],
 "Site-de-Pedagogia":[],
 "Dropshipping-e-Afiliados":[],
 "World-Designer":[],
 "Automacao-com-Python":[],
 "Analise-de-Dados-com-Python":[],
 "Nlw-Experts":[],
 "Curso-em-Video-Git-e-Github":[]
};

/* CONFIGURAÇÃO DE BOTÕES (true = mostrar no portfólio, false = só no código)
   SHOW_OPEN: botão "Abrir projeto" pela linguagem (StackBlitz / github.dev)
   SHOW_EMPTY_VIDEOS: botão "Vídeos Relacionados" mesmo sem vídeos.
   Com false, o botão aparece sozinho assim que você adicionar um vídeo ao projeto. */
var SHOW_OPEN=false, SHOW_EMPTY_VIDEOS=false;
/* Projetos com site funcionando (pasta projetos/ no GitHub). Os demais mostram "Site em construção" até terem arquivos publicados. */
var SITES=["Site-Wpohstore","Toplim-Catalogo-Virtual--Projeto-Final-","financeiro","LandingPageFocoinTech","P-gina-de-Checkout","Sistema-deposito-de-Bebidas-","Loja-Yshop-Online-Store","World-Designer","Nlw-Experts","Curso-em-Video-Git-e-Github"];
var U2="https://github.com/mateusaspereiraa/";
var USER="mateusaspereiraa", TAGS="#TI #Tecnologia #Portfolio";
/* [emoji, nome, área, repositório, legenda, hashtags, destaque, linguagem] */
var D=[
["🛠️","Manutenção de Computadores","Manutenção","","Diagnóstico, limpeza, troca de peças e formatação: o dia a dia que mantém empresas e pessoas trabalhando.\nVou mostrar o antes e o depois de cada atendimento.","#ManutencaoDeComputadores #SuporteTecnico #Hardware",1],
["🌐","Redes e Infraestrutura","Redes","","Cabeamento, configuração de roteadores, Wi-Fi e resolução de falhas de conexão, do problema à solução.","#Redes #Infraestrutura #SuporteTecnico",1],
["🛒","Site Wpoh Store","E-commerce","Site-Wpohstore","Construí o site da Wpoh Store, uma loja virtual pensada para apresentar produtos e facilitar a compra.","#Ecommerce #DesenvolvimentoWeb #HTML #CSS #JavaScript",0,"HTML/CSS/JS"],
["📒","Toplim Catálogo Virtual (Projeto Final)","Catálogo","Toplim-Catalogo-Virtual--Projeto-Final-","Projeto final: um catálogo virtual para a Toplim, organizando produtos de forma simples para o cliente consultar.","#CatalogoVirtual #ProjetoFinal #DesenvolvimentoWeb",0,"HTML/CSS/JS"],
["💰","Financeiro","Sistemas","financeiro","Lumina Finance: painel financeiro com dashboard, transações, metas e Open Finance, com gráficos e importação de planilhas Excel e CSV.","#Financas #Sistemas #Programacao",0,"HTML/CSS/JS"],
["🚀","Landing Page FocoinTech","Landing Pages","LandingPageFocoinTech","Landing page da FocoinTech, criada para apresentar a marca e converter visitantes em contatos.","#LandingPage #FrontEnd #WebDesign",0,"HTML/CSS/JS"],
["💳","Página de Checkout","Landing Pages","P-gina-de-Checkout","Página de checkout focada em deixar o fechamento da compra claro e sem atrito.","#Checkout #UX #FrontEnd #Ecommerce",0,"HTML/CSS/JS"],
["🍺","Sistema Depósito de Bebidas","Sistemas","Sistema-deposito-de-Bebidas-","Sistema de gestão para depósito de bebidas: bebidas, fornecedores, clientes, estoque, pedidos, relatórios e NFC. Funciona como app instalável (PWA).","#Sistemas #Estoque #Programacao",0,"HTML/CSS/JS"],
["🏬","DYeshop","E-commerce","dyeshop","Projeto DYeshop, a base da loja virtual que evoluí em outras versões.","#Ecommerce #WebDev #Projetos",0,"HTML/CSS/JS"],
["👟","Loja Yshop Online Store","E-commerce","Loja-Yshop-Online-Store","Loja Yshop: mais um projeto de e-commerce, com foco em experiência de compra.","#Ecommerce #LojaOnline #FrontEnd",0,"HTML/CSS/JS"],
["🎓","Site de Pedagogia","Landing Pages","Site-de-Pedagogia","Site para a área de pedagogia, apresentando serviços de forma clara e acolhedora.","#WebSite #Educacao #FrontEnd",0,"HTML/CSS/JS"],
["📈","Dropshipping e Afiliados","Negócios Digitais","Dropshipping-e-Afiliados","Projeto sobre dropshipping e marketing de afiliados, unindo tecnologia e vendas online.","#Dropshipping #Afiliados #MarketingDigital",0,"HTML/CSS/JS"],
["🎨","World Designer","Design","World-Designer","World Designer: projeto voltado a design e criatividade na web.","#Design #WebDesign #FrontEnd",0,"HTML/CSS/JS"],
["🐍","Automação com Python","Python","Automacao-com-Python","Automatizei tarefas repetitivas com Python para ganhar tempo.","#Python #Automacao #Produtividade",0,"Python"],
["📊","Análise de Dados com Python","Python","Analise-de-Dados-com-Python","Análise de dados com Python: transformar dados soltos em informação útil.","#Python #AnaliseDeDados #DataScience",0,"Python"],
["⚡","NLW Experts","Estudos","Nlw-Experts","Projeto do NLW Experts, evento intensivo de programação da Rocketseat.","#NLW #Rocketseat #Programacao",0,"JavaScript"],
["🔀","Git e GitHub (Curso em Vídeo)","Estudos","Curso-em-Video-Git-e-Github","Estudos de Git e GitHub pelo Curso em Vídeo: versionamento de código, base de todo projeto.","#Git #GitHub #CursoEmVideo",0,"Git"]
];

function key(d,i){return d[3]||(i===0?"manutencao":"redes")}
/* Abrir o projeto pela linguagem (alternativa quando o site hospedado não abre) */
function openByLang(d){
 var r=d[3],l=d[7];
 if(l==="Python")return{u:"https://github.dev/"+USER+"/"+r,t:"Abrir código Python"};
 if(l==="Git")return{u:"https://github.com/"+USER+"/"+r,t:"Abrir repositório"};
 return{u:"https://stackblitz.com/github/"+USER+"/"+r,t:"Abrir projeto ("+l+")"};
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function cap(d){return d[4]+"\n\n"+d[5]+" "+TAGS}

var cats=["Todos"];D.forEach(function(d){if(cats.indexOf(d[2])<0)cats.push(d[2])});
var cur="Todos",tabs=document.getElementById("tabs"),grid=document.getElementById("grid");
function draw(){
 tabs.innerHTML="";
 cats.forEach(function(c){var b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=function(){cur=c;draw()};tabs.appendChild(b)});
 grid.innerHTML="";
 D.forEach(function(d,i){
  if(cur!=="Todos"&&d[2]!==cur)return;
  var c=document.createElement("article");c.className="card"+(d[6]?" hl":"");
  var n=(VIDEOS[key(d,i)]||[]).length, links="";
  if(d[3]){
   var o=openByLang(d);
   links=d[7]==="Python"?'<a class="btn p" href="'+(location.hostname.indexOf("github.io")>=0?"projetos/"+d[3]+"/":"https://"+USER+".github.io/"+d[3]+"/")+'" target="_blank" rel="noopener">Abrir no navegador</a><a class="btn" href="https://github.dev/'+USER+'/'+d[3]+'" target="_blank" rel="noopener">Ver código</a>':(SITES.indexOf(d[3])>=0?'<a class="btn p" href="'+(location.hostname.indexOf("github.io")>=0&&d[3]!=="Toplim-Catalogo-Virtual--Projeto-Final-"?"projetos/"+d[3]+"/":"https://"+USER+".github.io/"+d[3]+"/")+'" target="_blank" rel="noopener">Ver site</a>':'<span class="btn" style="opacity:.65;cursor:default">Site em construção</span><a class="btn" href="'+U2+d[3]+'" target="_blank" rel="noopener">Ver código</a>')+(SHOW_OPEN?'<a class="btn" href="'+o.u+'" target="_blank" rel="noopener">'+o.t+'</a>':'')+'';
  }
  c.innerHTML='<div class="cover" aria-hidden="true">'+d[0]+'</div><div class="body"><div class="cat">'+d[2]+'</div><h3>'+d[1]+'</h3><p class="cap">'+esc(cap(d))+'</p><div class="row">'+links+''+(n||SHOW_EMPTY_VIDEOS?'<button class="btn v" data-v="'+i+'">Vídeos Relacionados ('+n+')</button>':'')+'<button class="btn" data-i="'+i+'">Copiar legenda</button></div></div>';
  grid.appendChild(c)});
}

var dlg=document.getElementById("dlg"),dbody=document.getElementById("dbody");
function player(v){
 var u=v.u,m=u.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([\w-]{11})/),h='<div class="vi"><h4>'+esc(v.t)+'</h4>';
 if(m)h+='<iframe src="https://www.youtube.com/embed/'+m[1]+'" title="'+esc(v.t)+'" allowfullscreen loading="lazy"></iframe>';
 else if(/\.(mp4|webm)(\?|$)/i.test(u))h+='<video controls preload="metadata" src="'+esc(u)+'"></video>';
 return h+'<p style="margin:8px 0 0"><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Assistir</a></p></div>';
}
function openVideos(i){
 var d=D[i],list=VIDEOS[key(d,i)]||[];
 document.getElementById("dt").textContent="Vídeos Relacionados: "+d[1];
 dbody.innerHTML=list.length?list.map(player).join(""):'<p class="empty">Os vídeos deste projeto serão publicados em breve.</p>';
 if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}
var runId=0;
function sl(ms){return new Promise(function(r){setTimeout(r,ms)})}
var ROWS=[['MOLO000251','Logitech','Mouse','1','25.95','6.50',''],['MOLO000192','Logitech','Mouse','2','19.95','5.00',''],['CAHA000251','Hashtag','Camisa','1','25.00','11.00',''],['CAHA000252','Hashtag','Camisa','2','25.00','11.00','Conferir estoque'],['MOMU000111','Multilaser','Mouse','1','11.99','3.40',''],['BOHA000251','Hashtag','Bone','1','25.00','11.00',''],['BOHA000252','Hashtag','Bone','2','25.00','11.00',''],['CAHA000273','Hashtag','Camisa','3','27.50','12.40','Troca de fornecedor'],['CAHA000274','Hashtag','Camisa','4','27.50','12.40',''],['CAHA000275','Hashtag','Camisa','5','27.50','12.40',''],['TELG000821','LG','Televisao','1','820.00','172.20',''],['TELG000252','LG','Televisao','2','250.00','62.50','']];
function bar(l,p){return '<div class="br"><span>'+l+'</span><i style="width:'+p+'%"></i><b>'+String(p).replace('.',',')+'%</b></div>'}
async function runDemo(i){
 var d=D[i],id=++runId;
 document.getElementById('dt').textContent='Executando: '+d[1];
 dbody.innerHTML='<pre class="log" id="lg"></pre><div id="rs"></div><p class="empty" id="nt"></p><div><button class="btn" id="rp">Executar de novo</button></div>';
 var lg=document.getElementById('lg'),rs=document.getElementById('rs');
 async function L(t,ms){if(id!==runId)throw 0;lg.textContent+=t+'\n';lg.scrollTop=lg.scrollHeight;await sl(ms||500)}
 document.getElementById('rp').onclick=function(){runDemo(i)};
 if(dlg.showModal){if(!dlg.open)dlg.showModal()}else dlg.setAttribute('open','');
 try{
  if(d[3]==='Automacao-com-Python'){
   document.getElementById('nt').textContent='Reprodução do codigo.py com os dados reais de produtos.csv (12 de 293 linhas). O script original usa pyautogui para controlar o mouse e o teclado do computador, por isso a execução real acontece só na máquina de quem roda.';
   await L('$ python codigo.py');
   await L('Passo 1: abrindo o Chrome e acessando o sistema da empresa...',900);
   await L('Passo 2: login feito (e-mail e senha digitados)',900);
   await L('Passo 3: lendo produtos.csv -> 293 linhas carregadas',800);
   rs.innerHTML='<table class="tb"><thead><tr><th>codigo</th><th>marca</th><th>tipo</th><th>cat.</th><th>preço</th><th>custo</th><th>obs</th></tr></thead><tbody id="tbd"></tbody></table>';
   for(var k=0;k<ROWS.length;k++){
    await L('Passo 4: cadastrando '+ROWS[k][0]+' ('+ROWS[k][1]+' '+ROWS[k][2]+') ... enter',350);
    var tr=document.createElement('tr');tr.innerHTML=ROWS[k].map(function(c){return '<td>'+c+'</td>'}).join('');document.getElementById('tbd').appendChild(tr);
   }
   await L('Passo 5: o laço repete até acabar as 293 linhas. Fim.',300);
  }else{
   document.getElementById('nt').textContent='Resultado real da execução do inicial.ipynb sobre cancelamentos_sample.csv (50.000 clientes), com a mesma lógica do notebook.';
   await L('Passo 1: lendo cancelamentos_sample.csv -> 50000 linhas, 12 colunas',700);
   await L('Passo 2: removendo a coluna CustomerID -> 11 colunas',700);
   await L('Passo 3: dropna() -> 4 linhas vazias removidas, 49996 restantes',800);
   await L('Passo 4: 28393 cancelaram (56,8%) | 21603 não cancelaram',800);
   await L('Passo 5: taxa de cancelamento por grupo',700);
   rs.innerHTML=bar('Contrato mensal',100)+bar('Contrato anual',46.4)+bar('Contrato trimestral',45.9)+bar('Mais de 4 ligações ao call center',99)+bar('Até 4 ligações',36.4)+bar('Atraso acima de 20 dias',100);
   await L('Filtrando: sem contrato mensal, até 4 ligações, atraso até 20 dias...',1100);
   rs.innerHTML+=bar('Base filtrada (26267 clientes)',18.4);
   await L('Conclusão: a taxa de cancelamento cai de 56,8% para 18,4%. Fim.',300);
  }
 }catch(e){}
}
dlg.addEventListener('close',function(){runId++});
document.getElementById("close").onclick=function(){dlg.close()};
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
grid.addEventListener("click",function(e){
 var r=e.target.closest("button[data-r]");if(r){runDemo(+r.dataset.r);return}
 var v=e.target.closest("button[data-v]");if(v){openVideos(+v.dataset.v);return}
 var b=e.target.closest("button[data-i]");if(!b)return;
 var t=cap(D[b.dataset.i]),done=function(){b.textContent="Copiado";setTimeout(function(){b.textContent="Copiar legenda"},1500)};
 try{navigator.clipboard.writeText(t).then(done,function(){})}catch(x){}
});
draw();
</script>
</body>
</html>
